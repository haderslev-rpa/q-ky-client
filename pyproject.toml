[project]
name = "ky-client"
version = "0.1.0"
description = "Client for Kommunernes Ydelsessystem (KY)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.54.0",
    "pytest>=8.4.1",
    "ruff>=0.15.11",
    "q-haderslev-vbo",
]

[tool.uv.sources]
q-haderslev_vbo = { git = "https://github.com/haderslev-rpa/q-haderslev-vbo.git", branch = "main" }

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring access to the real KY environment",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ky_client"]